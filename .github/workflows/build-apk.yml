name: Build Debug APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - run: chmod +x gradlew
      working-directory: ./MaesylanApp
    - run: ./gradlew assembleDebug
      working-directory: ./MaesylanApp
    - uses: actions/upload-artifact@v4
      with:
        name: Maesylan-Debug-APK
        path: MaesylanApp/app/build/outputs/apk/debug/app-debug.apk
    - uses: softprops/action-gh-release@v1
      if: github.ref == 'refs/heads/main'
      with:
        files: MaesylanApp/app/build/outputs/apk/debug/app-debug.apk
        name: "Maesylan Debug ${{ github.run_number }}"
        tag_name: "debug-${{ github.run_number }}"
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
