name: Build Debug APK

on:
  push:
    branches: [ main ]
    paths:
      - 'MaesylanApp/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      working-directory: ./MaesylanApp
      run: chmod +x gradlew
      
    - name: Build Debug APK
      working-directory: ./MaesylanApp
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Maesylan-Debug-APK
        path: MaesylanApp/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: MaesylanApp/app/build/outputs/apk/debug/app-debug.apk
        name: "Maesylan Debug Build ${{ github.run_number }}"
        tag_name: "debug-build-${{ github.run_number }}"
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
